<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Potluck · product demo</title>
    <script>
      try {
        var q = new URLSearchParams(location.search).get('theme')
        var c = q === 'light' || q === 'dark' ? q : localStorage.getItem('potluck-theme')
        document.documentElement.dataset.theme = c === 'light' || c === 'dark' ? c : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/demo/main.tsx"></script>
  </body>
</html>
